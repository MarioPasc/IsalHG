# T-M5a E3 — perturbation ladder (T-TBb proxy + scale tier).
#
# Each cell is one PerturbationLadderHypergraphs batch.
# Per-step d_I increments (d_I(H_{t-1}, H_t)) are logged for T-TBb:
# they bound per-edit R(e)/T_span(e) empirically.
#
# Three base sizes (small / medium / larger), two seeds each = 6 cells.
# All bases and rungs are connected (D-CONN1 via random_connected_edit).
#
# Analysis: experiments.article.analysis.ladder.analyze_ladder

output_root: /media/mpascual/Sandisk2TB/research/ISAL/isalhg/results/T-M5a/e3_ladder

cells:
  # ── Small bases (n=5, m=3) ───────────────────────────────────────────────
  - type: ladder
    dataset: perturbation_ladder
    seed: 42
    label: small_s0
    dataset_params:
      n_nodes: 5
      n_edges: 3
      arity_range: [2, 3]
      max_t: 10
      n_ladders: 8

  - type: ladder
    dataset: perturbation_ladder
    seed: 43
    label: small_s1
    dataset_params:
      n_nodes: 5
      n_edges: 3
      arity_range: [2, 3]
      max_t: 10
      n_ladders: 8

  # ── Medium bases (n=8, m=5) ───────────────────────────────────────────────
  - type: ladder
    dataset: perturbation_ladder
    seed: 42
    label: medium_s0
    dataset_params:
      n_nodes: 8
      n_edges: 5
      arity_range: [2, 3]
      max_t: 10
      n_ladders: 8

  - type: ladder
    dataset: perturbation_ladder
    seed: 43
    label: medium_s1
    dataset_params:
      n_nodes: 8
      n_edges: 5
      arity_range: [2, 3]
      max_t: 10
      n_ladders: 8

  # ── Larger bases (n=12, m=8) — past the exact-HGED ceiling ──────────────
  - type: ladder
    dataset: perturbation_ladder
    seed: 42
    label: large_s0
    dataset_params:
      n_nodes: 12
      n_edges: 8
      arity_range: [2, 4]
      max_t: 10
      n_ladders: 6

  - type: ladder
    dataset: perturbation_ladder
    seed: 43
    label: large_s1
    dataset_params:
      n_nodes: 12
      n_edges: 8
      arity_range: [2, 4]
      max_t: 10
      n_ladders: 6

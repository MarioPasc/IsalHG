# T-M5a E2 — density sweep (rho vs mean-max-degree Delta).
#
# Tests Theorem B's Δ-dependence: ρ(d_I, HGED) should decay with Δ.
# Six density bins spanning Δ ≈ 2 .. 8 (conditioned-ER mean max degree).
# Three seeds per bin = 18 cells. Run on Picasso.
#
# Analysis: experiments.article.analysis.density_sweep.analyze_density_sweep
# (loads the d_I and HGED D.npy from each cell; bins by corpus mean_max_degree)

output_root: /media/mpascual/Sandisk2TB/research/ISAL/isalhg/results/T-M5a/e2_density_sweep

cells:
  # ── Bin 1: Δ ≈ 2 (very sparse, 2-uniform) ───────────────────────────────
  - type: d_matrix
    dataset: correlation_corpus
    seed: 42
    label: delta_2_s0
    dataset_params:
      n_items: 25
      n_range: [5, 8]
      n_edges_range: [2, 3]
      arity_range: [2, 2]
    distances: [isalhg_levenshtein, exact_hged]

  - type: d_matrix
    dataset: correlation_corpus
    seed: 43
    label: delta_2_s1
    dataset_params:
      n_items: 25
      n_range: [5, 8]
      n_edges_range: [2, 3]
      arity_range: [2, 2]
    distances: [isalhg_levenshtein, exact_hged]

  - type: d_matrix
    dataset: correlation_corpus
    seed: 44
    label: delta_2_s2
    dataset_params:
      n_items: 25
      n_range: [6, 9]
      n_edges_range: [2, 3]
      arity_range: [2, 2]
    distances: [isalhg_levenshtein, exact_hged]


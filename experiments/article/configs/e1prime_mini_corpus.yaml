# T-M5a E1' — the exact-HGED mini-corpus (v3 discussion figure, D-ART2).
#
# One small connected corpus per cell, all pairs, two distances:
# d_I (isalhg_levenshtein on w*_c) and exact HGED. The corpus is built from
# perturbation ladders (DATA.md §4 composition): within-ladder pairs are
# perturbation pairs at known Qin budgets, cross-ladder pairs are unrelated —
# together they spread the structural-similarity range so the E1' scatter is
# populated across its range, not only near 0 and max.
#
# Sizing (DQ1' probe, 2026-07-19, local): exact HGED on ladder pairs at
# n<=10, m_attempts<=8, arity<=3 shows median 1–92 ms, p90 <= 2.5 s,
# max 4.8 s, 0 DNFs under a 30 s cap. Ceiling pinned at n<=10. No per-pair
# timeout here: E1' needs exact values (a censored pair would bias rho);
# the SLURM wallclock bounds the cell.
#
# 12 cells = 6 base sizes x 2 seeds; each cell 4 ladders x (8+1) snapshots
# = 36 items -> 630 pairs; ~7,560 (d_I, HGED) pairs total.
#
# Runs on Picasso: each cell is one SLURM array task
# (slurm/T-M5a_launcher.sh; array size via --count).
# Analysis (S5): experiments.article.analysis.correlation.analyze_correlation.

output_root: /mnt/home/users/tic_163_uma/mpascual/fscratch/isalhg_results/T-M5a/e1prime

cells:
  - type: d_matrix
    dataset: perturbation_ladder
    seed: 42
    label: n5_s0
    dataset_params:
      n_nodes: 5
      n_edges: 3
      arity_range: [2, 3]
      max_t: 8
      n_ladders: 4
    distances: [isalhg_levenshtein, exact_hged]


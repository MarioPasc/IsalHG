[build-system]
requires = [
    "scikit-build-core>=0.9",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
ninja.version = ">=1.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/isalhg"]
# Editable installs: scikit-build-core's default "redirect" mode places
# a .pth file that points sys.path at this src/ tree. The .so produced
# by CMake is installed inside src/isalhg/, so `import isalhg._core`
# finds it without copying. C++ edits require re-running `pip install -e`.

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[project]
name = "isalhg"
version = "0.0.1"
description = "Instruction Set and Language for Hypergraphs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Ezequiel Lopez-Rubio", email = "ezeqlr@lcc.uma.es"},
    {name = "Mario Pascual Gonzalez", email = "mpascual@uma.es"},
]
keywords = [
    "hypergraph",
    "hypergraph-representation",
    "instruction-strings",
    "hypergraph-isomorphism",
    "canonical-string",
    "combinatorics",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Core has zero dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/MarioPasc/IsalHG"
Repository = "https://github.com/MarioPasc/IsalHG"
Issues = "https://github.com/MarioPasc/IsalHG/issues"

[project.optional-dependencies]
# Hypergraph-library bridges (isalhg.adapters)
hypernetx = ["hypernetx>=2.4", "fastjsonschema>=2.20"]
xgi = ["xgi>=0.10"]
hypergraphx = ["hypergraphx>=1.7"]

# Iso baselines (isalhg.iso_backends).
# - pynauty: nauty 2.8 Python binding.
# - python-igraph: bliss via igraph.canonical_permutation.
# - Traces is a CLI binary (dreadnaut); install via the system package
#   manager or build nauty from source. No Python dep.
iso = [
    "pynauty>=2.8",
    "python-igraph>=0.11",
]

# Analysis and figures (experiments/analysis)
viz = ["matplotlib>=3.7"]
bench = [
    "isalhg[hypernetx,xgi,viz,iso]",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    # netlsd: full-member competitor since D-ART2 (metric_space.representations.netlsd)
    "netlsd>=1.0",
]

# Developer toolchain
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

eval = [
    "isalhg[hypernetx,xgi,viz,bench,iso]",
    "python-Levenshtein>=0.21",
]
all = ["isalhg[hypernetx,xgi,hypergraphx,viz,bench,dev,eval]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (external hypergraph libs or backend binaries)",
    "property: Property-based tests (hypothesis)",
    "slow: Long-running tests",
    "subprocess: Tests that shell out to an external binary (dreadnaut, ...)",
    "eval_validation: Validation tests on Picasso-generated eval data",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "hypernetx", "hypernetx.*",
    "xgi", "xgi.*",
    "hypergraphx", "hypergraphx.*",
    "pynauty", "pynauty.*",
    "igraph", "igraph.*",
    "Levenshtein", "Levenshtein.*",
    "scipy", "scipy.*",
    "yaml", "yaml.*",
    "networkx", "networkx.*",
    "matplotlib", "matplotlib.*",
    "netlsd", "netlsd.*",
]
ignore_missing_imports = true

# Viz backends call into the above libraries; the libraries lack type
# stubs so every call would otherwise raise no-untyped-call.
[[tool.mypy.overrides]]
module = ["isalhg.viz.backends.*"]
disable_error_code = ["no-untyped-call"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]
# N803/N806: argument and local variable names should be lowercase. Disabled
# at project scope because hypergraphs are conventionally named H, H1, H2 in
# mathematical notation (Berge 1973). This is uniform across docs/PROPOSAL.md
# and the seed proposal.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "ANN", "E402"]
"experiments/**/*.py" = ["E402", "ANN401"]
"src/isalhg/**/__init__.py" = ["F401"]
"src/isalhg/**/*.py" = ["ANN401"]

# RQ2 -- well-posedness. DESIGN.md section 3.
#
# Step 4 (certificate validity) is produced by the RQ3 runner into
# RQ2_wellposedness/certificate_validity/rows_certificate.csv and is only read
# by the analyzer. Step 5 (identity timing) is RQ7's rows_yield.
#
# The census reads the shared cached matrices for wd50k66 and ndc_classes and
# computes ndc_substances itself; submit the census with
# --dependency=afterok:<matrices job id>.

rq: 2
rq_folder: RQ2_wellposedness
experiment: wellposedness

pointer_budget_s: 60.0
oracle_budget_s: 600.0
arm_budget_s: 60.0
n_jobs: 1

# Step 0 -- exactness at zero, every representation of G3 on every collection.
exact0_collections: [wd50k66, ndc_classes, ndc_substances]
exact0_pairs: 100
exact0_arms:
  - fact_rank
  - isalhg_levenshtein
  - nauty_cert
  - nauty_cert_rows
  - wl_l1
  - netlsd
  - hpd_jsd
  - bipartite_ged_path
  - bipartite_ged_assign
  - size_l1
  - degree_seq_l1
  - exact_ged
  - hypercot

# Step 1 -- the false-merge census, over every arm that has a matrix.
census_collections: [wd50k66, ndc_classes, ndc_substances]
census_own_collections: [ndc_substances]   # the ones this runner builds itself
census_arms:
  - fact_rank
  - nauty_cert
  - nauty_cert_rows
  - wl_l1
  - netlsd
  - hpd_jsd
  - bipartite_ged_path
  - bipartite_ged_assign
  - size_l1
  - degree_seq_l1

# Step 2 -- bipartite metricity on real members.
bipartite_collections: [wd50k66, ndc_classes, ndc_substances]
bipartite_path_arm: bipartite_ged_path
bipartite_assign_arm: bipartite_ged_assign
bipartite_pairs: 2000
bipartite_triples: 5000

# Step 3 -- the oracle ceiling and the gated HyperCOT timing row.
oracle_collections: [wd50k66, ndc_classes]
oracle_arm: exact_ged
oracle_pairs: 30
oracle_m_max: 8
hypercot_collections: [wd50k66]
hypercot_pairs: 20
hypercot_member_gate: 20

# 39 exact0 + 30 census + 3 bipartite + 6 oracle + 1 hypercot = 79 units, one
# shard each. The launcher submits two arrays (--kinds), so this value is used
# only by an unfiltered run; a filtered one takes its shard count from the
# filtered unit list.
n_shards: 79

smoke:
  member_limit: 20
  pointer_budget_s: 5.0
  oracle_budget_s: 20.0
  arm_budget_s: 20.0
  exact0_collections: [ndc_classes]
  exact0_pairs: 5
  exact0_arms: [fact_rank, nauty_cert, netlsd, bipartite_ged_path, size_l1]
  census_collections: [ndc_classes]
  census_own_collections: [ndc_classes]
  census_arms: [fact_rank, nauty_cert, size_l1]
  bipartite_collections: [ndc_classes]
  bipartite_pairs: 10
  bipartite_triples: 10
  oracle_collections: [ndc_classes]
  oracle_pairs: 3
  hypercot_collections: []
  n_shards: 1

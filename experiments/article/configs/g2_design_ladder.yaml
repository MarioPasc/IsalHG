# T-M7e G2 — design-seeded perturbation ladders (Stratum A admitted designs).
#
# Each cell uses one admitted catalog design as the ladder base, then applies
# max_arity = design_arity (auto-detected) for connectivity-preserving edits.
# This produces HGED-free ladder-response curves where the endpoints are
# recognizable (the known design) and intermediate steps are interpretable.
#
# Coverage: one cell per design family, two PRNG seeds each.
# Wall-clock: all admitted designs ≤1.3s w*_c → fast local (< 2 min total).
#
# Analysis: experiments.article.analysis.g2 ladder-response (budget-Shepard)

output_root: /media/mpascual/Sandisk2TB/research/ISAL/isalhg/results/T-M7q/g2_design_ladder

cells:
